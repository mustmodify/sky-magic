<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score spectrum — SkyMagic</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 24px; background: #f9f9f7; color: #0b0b0b;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px;
  }
  @media (prefers-color-scheme: dark) { body { background: #0d0d0d; color: #fff; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #898781; font-size: 13px; margin-bottom: 20px; }
  #strip { height: 44px; border-radius: 8px; margin-bottom: 24px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .cell { border-radius: 8px; padding: 10px 12px; line-height: 1.35; }
  .cell .score { font-size: 17px; font-weight: 700; }
  .cell .grade { font-size: 13px; font-weight: 600; }
  .cell .hex { font-size: 11px; opacity: 0.8; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<h1>Score spectrum</h1>
<div class="sub">0.0 → 4.3 in 0.1 steps · tier anchors RGB-lerped toward the next tier · grades start at the bottom of their band</div>
<div id="strip"></div>
<div id="grid"></div>

<script>
function color(score) {
  const TIERS = [
    { low: 0.0, high: 0.7, color: '#D11A5B' }, // F (Fuchsia)
    { low: 0.7, high: 1.3, color: '#E64A19' }, // D
    { low: 1.3, high: 1.7, color: '#FF7043' }, // D+
    { low: 1.7, high: 2.0, color: '#FFA726' }, // C-
    { low: 2.0, high: 2.3, color: '#FFCA28' }, // C
    { low: 2.3, high: 2.7, color: '#FFEE58' }, // C+
    { low: 2.7, high: 3.0, color: '#D4E157' }, // B-
    { low: 3.0, high: 3.3, color: '#9CCC65' }, // B
    { low: 3.3, high: 3.7, color: '#66BB6A' }, // B+
    { low: 3.7, high: 4.0, color: '#4CAF50' }, // A-
    { low: 4.0, high: 4.3, color: '#1B5E20' }, // A (deep forest — clearly darker than A-)
    { low: 4.3, high: 5.0, color: '#007A78' }  // A+ (Teal)
  ];

  const hexToRgb = hex => hex.replace(/^#/, '').match(/.{2}/g).map(x => parseInt(x, 16));
  const rgbToHex = rgb => '#' + rgb.map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, '0')).join('').toUpperCase();
  const lerp = (start, end, t) => start + (end - start) * t;

  if (score < 0) score = 0;
  let tierIndex = TIERS.findIndex(t => score >= t.low && score < t.high);
  if (score >= 4.3) tierIndex = TIERS.length - 1;

  const currentTier = TIERS[tierIndex];
  let finalHex = currentTier.color;

  if (tierIndex < TIERS.length - 1) {
    const nextTier = TIERS[tierIndex + 1];
    const t = (score - currentTier.low) / (currentTier.high - currentTier.low);

    const c1 = hexToRgb(currentTier.color);
    const c2 = hexToRgb(nextTier.color);

    const mixedRgb = [
      lerp(c1[0], c2[0], t),
      lerp(c1[1], c2[1], t),
      lerp(c1[2], c2[2], t)
    ];

    finalHex = rgbToHex(mixedRgb);
  }

  return finalHex;
}

// Same rubric as the server: a letter starts at the bottom of its band.
const gradeOf = s =>
  s >= 4.3 ? 'A+' : s >= 4.0 ? 'A' : s >= 3.7 ? 'A-' :
  s >= 3.3 ? 'B+' : s >= 3.0 ? 'B' : s >= 2.7 ? 'B-' :
  s >= 2.3 ? 'C+' : s >= 2.0 ? 'C' : s >= 1.7 ? 'C-' :
  s >= 1.3 ? 'D+' : s >= 0.7 ? 'D' : 'F';

// Dark text on light swatches, light text on dark ones.
const ink = hex => {
  const [r, g, b] = hex.replace(/^#/, '').match(/.{2}/g).map(x => parseInt(x, 16));
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#1c1c00' : '#ffffff';
};

const strip = document.getElementById('strip');
const stops = [];
for (let i = 0; i <= 430; i += 5) stops.push(`${color(i / 100)} ${(i / 430 * 100).toFixed(1)}%`);
strip.style.background = `linear-gradient(to right, ${stops.join(', ')})`;

const grid = document.getElementById('grid');
for (let i = 0; i <= 43; i++) {
  const s = i / 10;
  const hex = color(s);
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.style.background = hex;
  cell.style.color = ink(hex);
  cell.innerHTML = `<div class="score">${s.toFixed(1)}</div><div class="grade">${gradeOf(s)}</div><div class="hex">${hex}</div>`;
  grid.appendChild(cell);
}
</script>
</body>
</html>
